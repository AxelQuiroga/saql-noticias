  <title id="title">Cresta Roja: efluentes y arroyo Ortega</title>
  <desc id="desc">Esquema ilustrativo de una planta industrial, su tratamiento de efluentes y el arroyo Ortega. Señala que ACUMAR informó en marzo de 2026 un conducto con descarga fuera de parámetro.</desc>
